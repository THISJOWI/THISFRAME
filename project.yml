name: thisjellyfix
packages:
  # Google Cast iOS Sender SDK (binario oficial vía SPM, único canal soportado
  # desde que CocoaPods quedó deprecado). Solo iOS: el manifest del paquete
  # declara platforms [.iOS(.v16)] — por eso SOLO el target Cast-iOS lo usa.
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    from: 4.8.6
options:
  bundleIdPrefix: com.thisjellyfix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: thisjellyfix
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: LSKYSF7629
    # Without this xcodegen emits no CODE_SIGN_STYLE and xcodebuild treats
    # every target as MANUAL signing → "No profiles for … were found" on
    # device builds (simulator hides it behind CODE_SIGNING_ALLOWED=NO).
    CODE_SIGN_STYLE: Automatic
targets:
  Core-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-iOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Discovery-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixDiscovery]
    dependencies:
      - target: Core-iOS
      - target: Networking-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixDiscovery, PRODUCT_NAME: ThisJellyFixDiscovery } }
  Playback-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixPlayback]
    dependencies:
      - target: Core-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixPlayback, PRODUCT_NAME: ThisJellyFixPlayback } }
  # Cast solo existe en iOS: Google no publica SDK de Cast para macOS nativo,
  # tvOS ni visionOS. Feature-iOS lo importa condicionalmente (canImport).
  Cast-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixCast]
    dependencies:
      - target: Core-iOS
      - target: Networking-iOS
      # Static: los símbolos se fusionan en Cast-iOS (el wrapper dinámico de
      # SPM NO propaga el binario cuando un framework intermedio lo enlaza,
      # provocando undefined symbols en el link de la app). No usamos los
      # bundles de UI de Google (selector propio en SwiftUI) ni Catalyst,
      # así que las contraindicaciones de la variante static no aplican.
      - package: GoogleCast
        product: GoogleCastStatic
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCast, PRODUCT_NAME: ThisJellyFixCast } }
  Feature-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixFeature]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-iOS
      - target: Networking-iOS
      - target: Playback-iOS
      - target: Discovery-iOS
      - target: Cast-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-iOS
        embed: true
      - target: Networking-iOS
        embed: true
      - target: Playback-iOS
        embed: true
      - target: Feature-iOS
        embed: true
      - target: Discovery-iOS
        embed: true
      - target: Cast-iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.ios
        INFOPLIST_FILE: Apps/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/ThisJellyfix.entitlements
        # GoogleCastStatic (SPM): Google exige -ObjC en el app con la
        # variante static — las categorías ObjC del SDK no se cargan sin él.
        OTHER_LDFLAGS: "$(inherited) -ObjC"

  Core-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-macOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Discovery-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixDiscovery]
    dependencies:
      - target: Core-macOS
      - target: Networking-macOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixDiscovery, PRODUCT_NAME: ThisJellyFixDiscovery } }
  Playback-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixPlayback]
    dependencies:
      - target: Core-macOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixPlayback, PRODUCT_NAME: ThisJellyFixPlayback } }
  Feature-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixFeature]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-macOS
      - target: Networking-macOS
      - target: Playback-macOS
      - target: Discovery-macOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-macOS
        embed: true
      - target: Networking-macOS
        embed: true
      - target: Playback-macOS
        embed: true
      - target: Feature-macOS
        embed: true
      - target: Discovery-macOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.macos, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-macOS, GENERATE_INFOPLIST_FILE: NO, INFOPLIST_FILE: Apps/macOS/Info.plist, CODE_SIGN_ENTITLEMENTS: Apps/macOS/ThisJellyfix.entitlements } }

  Core-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-tvOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Discovery-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixDiscovery]
    dependencies:
      - target: Core-tvOS
      - target: Networking-tvOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixDiscovery, PRODUCT_NAME: ThisJellyFixDiscovery } }
  Playback-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixPlayback]
    dependencies:
      - target: Core-tvOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixPlayback, PRODUCT_NAME: ThisJellyFixPlayback } }
  Feature-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixFeature]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-tvOS
      - target: Networking-tvOS
      - target: Playback-tvOS
      - target: Discovery-tvOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-tvOS:
    type: application
    platform: tvOS
    sources: [Apps/tvOS]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-tvOS
        embed: true
      - target: Networking-tvOS
        embed: true
      - target: Playback-tvOS
        embed: true
      - target: Feature-tvOS
        embed: true
      - target: Discovery-tvOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.tvos, CODE_SIGN_ENTITLEMENTS: Apps/tvOS/ThisJellyfix.entitlements } }

  Core-visionOS:
    type: framework
    platform: visionOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-visionOS:
    type: framework
    platform: visionOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-visionOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Discovery-visionOS:
    type: framework
