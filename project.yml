    platform: visionOS
    sources: [Apps/visionOS]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-visionOS
        embed: true
      - target: Networking-visionOS
        embed: true
      - target: Playback-visionOS
        embed: true
      - target: Feature-visionOS
        embed: true
      - target: Discovery-visionOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.visionos, CODE_SIGN_ENTITLEMENTS: Apps/visionOS/ThisJellyfix.entitlements } }
